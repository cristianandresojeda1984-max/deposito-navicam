<style>
:root{
  --bg:#0b1220;--panel:#121b2e;--panel2:#18233a;--line:#25324d;--txt:#e6ebf5;--muted:#8d9ab3;
  --amber:#f2b233;--blue:#4cb3f0;--green:#34c77b;--red:#ef5d5d;--violet:#a78bfa;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:Consolas,'Cascadia Mono','IBM Plex Mono',monospace}
a{color:var(--blue)}
#app{display:flex;min-height:100vh}
/* barra lateral */
#side{width:212px;flex:0 0 212px;background:#0e1628;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:4px;position:sticky;top:0;height:100vh}
.marca{display:flex;align-items:center;gap:10px;padding:4px 6px 16px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--amber);color:#1a1300;font-weight:800;display:grid;place-items:center;font-size:18px}
.marca b{display:block;font-size:15px}.marca span{font-size:12px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);cursor:pointer;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:var(--panel);color:var(--txt)}
.nav.on{background:var(--panel2);color:var(--txt);box-shadow:inset 3px 0 0 var(--amber)}
.nav .ic{width:18px;text-align:center}
.side-pie{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:10px 6px 0;border-top:1px solid var(--line)}
.dolar{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.dolar small{color:var(--muted);font-size:11px;display:block}
.dolar b{font-size:16px;color:var(--amber)}
.prueba{font-size:11px;color:var(--muted);line-height:1.4}
.prueba b{color:var(--amber)}
/* contenido */
#main{flex:1;min-width:0;padding:22px 26px 60px}
.cab{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.cab h1{margin:0;font-size:22px}
.cab p{margin:4px 0 0;color:var(--muted);font-size:13px}
.acciones{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#3a4a6b}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1a1300;font-weight:600}
.btn.azul{background:#123049;border-color:#1f5578;color:#bfe4fb}
.btn.verde{background:#0f3a26;border-color:#1c6b45;color:#bdf3d6}
.btn.rojo{background:#3a1416;border-color:#6b2226;color:#ffc9c9}
.btn.chico{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.kpi small{color:var(--muted);font-size:12px;display:block}
.kpi b{font-size:26px;display:block;margin:4px 0}
.kpi span{color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 10px;font-size:12px;cursor:default;white-space:nowrap}
button.chip{cursor:pointer}
.chip.on{border-color:var(--amber);color:var(--amber)}
.tag{display:inline-block;font-size:11px;border-radius:5px;padding:2px 6px;margin:1px 2px 1px 0;white-space:nowrap}
.t-amber{background:#3b2c08;color:#f8cf6e}.t-blue{background:#0f2e45;color:#9fd6f7}.t-green{background:#0f3324;color:#8fe3b7}
.t-red{background:#3d1517;color:#ffaaaa}.t-violet{background:#2a2148;color:#cbbcff}.t-gris{background:#1f2a40;color:#aab5ca}
input.in,select.in,textarea.in{background:#0d1526;border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;width:100%}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--blue)}
.lbl{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
.campo{display:flex;flex-direction:column}
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px 8px;border-bottom:1px solid #1c2740;vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#152039}
table.t tr.sel td{background:#172744}
.der{text-align:right}.cen{text-align:center}
.num{font-family:Consolas,'Cascadia Mono',monospace;white-space:nowrap}
.vacio{padding:26px;text-align:center;color:var(--muted)}
.fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sep{height:1px;background:var(--line);margin:14px 0}
.total-linea{display:flex;justify-content:space-between;padding:4px 0}
.total-grande{font-size:20px;font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.estado{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.e-abierto{background:#0f2e45;color:#9fd6f7}.e-vendido{background:#0f3324;color:#8fe3b7}.e-parcial{background:#3b2c08;color:#f8cf6e}
.e-novendido{background:#3d1517;color:#ffaaaa}.e-vencido{background:#262f42;color:#aab5ca}.e-vencehoy{background:#4a2a06;color:#ffc46b}
.iva{font-size:.78em;color:var(--muted);font-family:inherit;font-weight:500}
.badge-nav{margin-left:auto;background:var(--amber);color:#1a1300;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.lista-scroll{max-height:calc(100vh - 210px);overflow:auto}
.lista-scroll table.t th{position:sticky;top:0;background:var(--panel);z-index:1}
.fija{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
/* buscador sugerencias */
.busca{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#0f1930;border:1px solid var(--line);border-radius:8px;max-height:330px;overflow:auto;z-index:20;box-shadow:0 10px 30px #0008}
.sug div{padding:7px 10px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.sug div:hover,.sug div.act{background:#172744}
.sug .mono{color:var(--amber);min-width:110px}
/* tarjetas depósito */
.tarj{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.tarj .t1{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.tarj .cod{font-family:Consolas,monospace;font-size:17px;color:var(--amber);font-weight:700}
.tarj .desc{margin:6px 0 10px;color:#cfd8ea}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mini div{background:var(--panel2);border-radius:8px;padding:8px 10px}
.mini small{display:block;color:var(--muted);font-size:11px}
.cajon{cursor:pointer}
.cajon:hover{border-color:#3a4a6b}
/* modal */
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
#modal.on{display:flex}
#modal .caja{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(920px,100%);padding:20px}
#modal .caja.ancha{width:min(860px,100%)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center}
#toast div{background:#1d2b47;border:1px solid #33456b;border-radius:10px;padding:10px 16px;box-shadow:0 8px 30px #0009;max-width:90vw;white-space:pre-line}
#toast div.ok{border-color:#1c6b45}#toast div.err{border-color:#8a2c31}
#carga{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100;color:var(--muted);font-size:15px}
/* hoja A4 cliente */
.hoja{width:794px;min-height:1123px;background:#fff;color:#141a26;padding:56px 56px 48px;display:flex;flex-direction:column;gap:24px;margin:0 auto;font-family:'Segoe UI',Arial,sans-serif}
.hoja .h-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:3px solid #141a26;padding-bottom:16px}
.hoja .h-tit{font-size:26px;font-weight:700}
.hoja .gris{color:#4a5468}
.hoja .h-chip{border:1px solid #c9cfdb;border-radius:6px;padding:4px 8px;font-size:13px}
.hoja table{width:100%;border-collapse:collapse;font-size:12.5px}
.hoja th{background:#141a26;color:#fff;font-weight:600;padding:8px 6px;text-align:left}
.hoja td{padding:9px 6px;border-bottom:1px solid #dde2ea}
.hoja .r{text-align:right}
.hoja .d{font-weight:700;color:#0f6b3d}
.hoja .tot{flex:0 0 300px;display:flex;flex-direction:column;gap:7px;font-size:14px}
.hoja .tot div{display:flex;justify-content:space-between}
.hoja .pie{margin-top:auto;font-size:12px;color:#4a5468;border-top:1px solid #dde2ea;padding-top:12px;white-space:pre-line}
#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  .hoja{margin:0;min-height:auto;height:auto}
}
/* barra móvil */
#topMovil{display:none}
@media (max-width:900px){
  #app{display:block}
  #side{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-105%);transition:transform .2s;height:auto}
  #side.abierto{transform:none;box-shadow:0 0 40px #000c}
  #topMovil{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#0e1628;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  #main{padding:16px 14px 60px}
  .g4,.g3,.g2,.split{grid-template-columns:minmax(0,1fr)}
  .mini{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ocultar-movil{display:none}
  .tabla-scroll{overflow-x:auto}
}
.evento:hover{background:#172744}

.btnAct{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:15px;line-height:1;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,border-color .2s}
.btnAct:hover{color:var(--txt);border-color:var(--muted)}
.btnAct.girando{animation:girar 1s linear infinite;pointer-events:none}
@keyframes girar{to{transform:rotate(360deg)}}

.link-cajon{display:block;font-size:12px;color:var(--blue,#7cb4ff);text-decoration:none;padding:6px 0;line-height:1.3}
.link-cajon:hover{text-decoration:underline}
tr.fila-marcada td{background:rgba(245,180,40,.18)!important;transition:background .4s}

.grilla-ped{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.grilla{border-collapse:collapse}.grilla th{position:sticky;top:0;background:var(--panel2);z-index:1}
.grilla td{padding:0 !important;border-bottom:1px solid var(--line)}
.grilla td.muted,.grilla td.desc-celda{padding:4px 8px !important}
.grilla td.desc-celda{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px}
.celda{width:100%;box-sizing:border-box;background:transparent;border:1px solid transparent;color:var(--txt);padding:7px 8px;font-size:14px;outline:none}
.celda:focus{border-color:var(--amber);background:#0f1729}
.celda.der{text-align:right}

<script>
'use strict';
// ============ Almacenamiento local (IndexedDB) ============
const DB_NOMBRE = 'navicam_app';
let _db = null;
function abrirDB() {
  return new Promise((ok, mal) => {
    const rq = indexedDB.open(DB_NOMBRE, 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
    rq.onsuccess = () => { _db = rq.result; ok(); };
    rq.onerror = () => mal(rq.error);
  });
}
function dbLeerTodo() {
  return new Promise((ok, mal) => {
    const out = {};
    const tx = _db.transaction('kv', 'readonly');
    const cur = tx.objectStore('kv').openCursor();
    cur.onsuccess = () => { const c = cur.result; if (c) { out[c.key] = c.value; c.continue(); } else ok(out); };
    cur.onerror = () => mal(cur.error);
  });
}
function dbGuardar(clave, valor) {
  return new Promise((ok, mal) => {
    const tx = _db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(valor, clave);
    tx.oncomplete = ok; tx.onerror = () => mal(tx.error);
  });
}
function dbBorrarTodo() {
  return new Promise((ok, mal) => {
    const tx = _db.transaction('kv', 'readwrite');
    tx.objectStore('kv').clear();
    tx.oncomplete = ok; tx.onerror = () => mal(tx.error);
  });
}

// ============ Estado ============
const CLAVES = ['dolar', 'stock', 'precios', 'sobre', 'cajones', 'notas', 'ubicCambios', 'reposicionado', 'pedidoNegocio', 'promos',
  'clientes', 'presupuestos', 'motivos', 'registro', 'ajustes', 'contador', 'borrador', 'archivos', 'agenda', 'avisados', 'versionDatos', 'nexpro', 'reemplazos', 'metas', 'propios', 'pedidos'];
const S = {
  dolar: 1520, stock: [], precios: {}, sobre: [], cajones: [], notas: {}, ubicCambios: {}, reposicionado: {}, pedidoNegocio: {}, promos: {},
  clientes: [], presupuestos: [], motivos: [], registro: [], ajustes: {}, contador: 0, borrador: null, archivos: {}, agenda: [], avisados: {}, versionDatos: 1, nexpro: {}, reemplazos: {}, metas: {}, propios: {}, pedidos: []
};
const MOTIVOS_BASE = ['Precio', 'Plazo de entrega', 'Sin stock', 'Lo compró en otro lado', 'Otro'];
const CATEGORIAS = [
  { id: 'generales', corto: 'General', largo: 'Clientes generales' },
  { id: 'mayoristas', corto: 'Mayorista', largo: 'Repuesteros mayoristas' },
  { id: 'especiales', corto: 'Especial', largo: 'Clientes especiales' },
  { id: 'transporte', corto: 'Transporte', largo: 'Transporte y logística' }
];
const AJUSTES_BASE = {
  empresa: 'Navicam · Repuestos Rosario',
  datosEmpresa: '[Dirección · teléfono · e-mail]',
  pie: 'Precios en pesos + IVA. Se mantienen hasta la fecha de validez indicada.\n[Forma de pago y condiciones de entrega]',
  validez: 7
};
let stockIdx = new Map();   // código → fila de stock
let sobreIdx = new Map();   // código → [items sobre stock]

function guardar(...claves) {
  claves.forEach(k => dbGuardar(k, S[k]).catch(e => aviso('No se pudo guardar (' + k + '): ' + e.message, 'err')));
  if (claves.includes('stock')) indexarStock();
  if (claves.includes('sobre')) indexarSobre();
}
function indexarStock() { stockIdx = new Map(); S.stock.forEach(r => stockIdx.set(r[0], r)); }
function indexarSobre() {
  sobreIdx = new Map();
  S.sobre.forEach(x => { if (!sobreIdx.has(x.cod)) sobreIdx.set(x.cod, []); sobreIdx.get(x.cod).push(x); });
}

// ============ Utilidades ============
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function r2(n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }
function fmt(n, dec = 2) { return Number(n || 0).toLocaleString('es-AR', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
function plata(n) { return '$ ' + fmt(n); }
function plata0(n) { return '$ ' + fmt(Math.round(n), 0); }
function masIva(n) { return plata(n) + ' <span class="iva">+ IVA</span>'; }
function masIva0(n) { return plata0(n) + ' <span class="iva">+ IVA</span>'; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function sumarDias(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + Number(n || 0)); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fechaAR(iso) { if (!iso) return ''; const [a, m, d] = iso.slice(0, 10).split('-'); return d + '/' + m + '/' + a; }
function ahoraTxt() { return new Date().toLocaleString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
function mesDe(iso) { return iso.slice(0, 7); }
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function nombreMes(ym) { const [a, m] = ym.split('-'); return MESES[Number(m) - 1].replace(/^./, c => c.toUpperCase()) + ' ' + a; }
function normalizar(v) { return String(v === undefined || v === null ? '' : v).normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase(); }
function limpiarCodigo(v) {

function infoArticulo(cod) {
  const p = S.precios[cod];
  const st = stockIdx.get(cod);
  const sob = sobreIdx.get(cod) || [];
  // Artículo propio (no es de Iveco): lo cargaron ellos, con precio en pesos
  const pr = !p && !st ? S.propios[cod] : null;
  const desc = st ? descuentoPedidos(cod) : 0;
  if (pr) return { cod, desc: pr.desc || '', usd: 0, D: '', enLista: false, propio: true, precioArs: Number(pr.precio) || 0, tipo: pr.tipo || '',
    stock: pr.stock === null || pr.stock === undefined || pr.stock === '' ? null : pr.stock, ubic: pr.ubic || '-',
    sobre: sob.reduce((a, x) => a + (x.cant || 0), 0), sobreDet: sob, repos: false, reposMes: '' };
  return {
    cod,
    desc: (st && st[1]) || (p && p[1]) || '',
    usd: p ? Number(p[0]) || 0 : 0,
    D: p ? String(p[2] || '').trim() : '',
    enLista: !!p,
    stock: st ? (desc ? Math.round(((parseFloat(String(st[2]).replace(',', '.')) || 0) - desc) * 100) / 100 : st[2]) : null, stockDesc: desc,
    ubic: st ? (S.ubicCambios[cod] || st[3]) : null,
    sobre: sob.reduce((a, x) => a + (x.cant || 0), 0),
    sobreDet: sob,
    repos: S.reposicionado[cod] !== undefined,
    reposMes: S.reposicionado[cod] || ''
  };
}
// Descuento provisorio: lo que se sacó para pedidos armados desde la última importación del stock (al importar un Excel nuevo, manda el Excel)
let _revPedidos = 0, _claveDesc = '', _desc = new Map();
function marcarPedidos() { _revPedidos++; }
function descuentoPedidos(cod) {
  const clave = S.metas.stock + '|' + _revPedidos;
  if (clave !== _claveDesc) {
    _claveDesc = clave; _desc = new Map();
    (S.pedidos || []).forEach(p => (p.items || []).forEach(l => (l.sacado || []).forEach(x => {
      if (x.stockV === S.metas.stock) _desc.set(l.cod, (_desc.get(l.cod) || 0) + (Number(x.cant) || 0));
    })));
  }
  return _desc.get(cod) || 0;
}
function buscarArticulos(q, max = 12) {
  q = normalizar(q);
  if (q.length < 2) return [];
  const qU = q.toUpperCase();
  const out = []; const vistos = new Set();
  const agregar = c => { if (!vistos.has(c)) { vistos.add(c); out.push(c); } };
  if (S.precios[qU] || stockIdx.has(qU) || S.propios[qU]) agregar(qU);
  // artículos propios (son pocos: se buscan primero por código y por descripción)
  const palabrasP = q.split(/\s+/).filter(Boolean);
  for (const c in S.propios) { if (out.length >= max) break; const t = normalizar(c + ' ' + (S.propios[c].desc || '')); if (c.startsWith(qU) || palabrasP.every(x => t.includes(x))) agregar(c); }
  // prefijo de código
  for (const r of S.stock) { if (out.length >= max) break; if (r[0].startsWith(qU)) agregar(r[0]); }
  if (out.length < max) for (const c in S.precios) { if (out.length >= max) break; if (c.startsWith(qU)) agregar(c); }
  // descripción (todas las palabras)
  const palabras = q.split(/\s+/).filter(Boolean);
  if (out.length < max) for (const r of S.stock) {
    if (out.length >= max) break;
    const d = normalizar(r[1]); if (palabras.every(p => d.includes(p))) agregar(r[0]);
  }
  if (out.length < max) for (const c in S.precios) {
    if (out.length >= max) break;
    const d = normalizar(S.precios[c][1]); if (palabras.every(p => d.includes(p))) agregar(c);
  }
  return out;
}

// "30" → [30]; "25/27" → [25,27]; "" → [] (sin descuento); "+11" → sin interpretar
function opcionesDesc(txt) {
  const s = String(txt || '').trim();
  if (!s || s === '-' || s === '—') return { valores: [], raro: false };
  if (/^\+/.test(s)) return { valores: [], raro: true };
  const m = s.match(/\d+(?:[.,]\d+)?/g);
  if (!m) return { valores: [], raro: true };
  return { valores: m.map(x => Number(x.replace(',', '.'))), raro: false };
}

}

// ============ Cálculo de líneas ============
function calcularLinea(l, dolar) {
  l.listaArs = l.listaManual ? r2(l.listaManual) : r2(l.usd * dolar);
  l.unit = r2(l.listaArs * (1 - (Number(l.descPct) || 0) / 100));
  l.sub = r2(l.unit * (Number(l.cant) || 0));
  return l;
}
function totales(items, campoCant) {
  let sub = 0, lista = 0;
  items.forEach(l => {
    const q = campoCant ? (Number(l[campoCant]) || 0) : (Number(l.cant) || 0);
    sub += r2(l.unit * q); lista += r2(l.listaArs * q);
  });
  sub = r2(sub);
  return { sub, lista: r2(lista), ahorro: r2(lista - sub) };
}
// Montos de un presupuesto: siempre sin IVA
function montoPresu(p) { return totales(p.items).sub; }
function montoVendido(p) { return p.estado === 'cerrado' ? totales(p.items, 'vendido').sub : 0; }
function estadoPresu(p) {
  if (p.estado === 'cerrado') {
    const vend = p.items.filter(l => (l.vendido || 0) > 0);
    const completos = p.items.every(l => (l.vendido || 0) >= l.cant);
    if (!vend.length) return 'novendido';
    return completos ? 'vendido' : 'parcial';
  }
  const h = hoyISO();
  return h > p.hasta ? 'vencido' : h === p.hasta ? 'vencehoy' : 'abierto';
}
const ESTADO_TXT = { abierto: 'Vigente', vencehoy: 'Vence hoy', vencido: 'Vencido', vendido: 'Vendido', parcial: 'Vendido parcial', novendido: 'No vendido' };
function chipEstado(p) {
  const e = estadoPresu(p);
  let t = ESTADO_TXT[e];
  if (e === 'novendido') { const m = motivosDe(p)[0]; if (m) t += ' · ' + m.toLowerCase(); }
  return `<span class="estado e-${e}">${esc(t)}</span>`;
}
function motivosDe(p) { return [...new Set(p.items.filter(l => (l.vendido || 0) < l.cant && l.motivo).map(l => l.motivo))]; }

async function guardarSobreFila(id) {

// ============ Agenda ============
let anioAgenda = new Date().getFullYear();
// Eventos de un mes: cumpleaños de las fichas + anotaciones (las anuales aparecen todos los años)
function eventosDelMes(anio, mes) {
  const out = [];
  S.clientes.forEach(c => { if (mesCumple(c.cumple) === mes) out.push({ tipo: 'cumple', id: c.id, dia: diaCumple(c.cumple), texto: 'Cumpleaños de ' + (c.contacto || c.nombre), sub: c.contacto ? c.nombre : '', anual: true }); });
  S.agenda.forEach(e => {
    const [a, m, d] = e.fecha.split('-').map(Number);
    if (m !== mes) return;
    if (!e.anual && a !== anio) return;
    const cli = e.clienteId ? cliente(e.clienteId) : null;
    out.push({ tipo: 'agenda', id: e.id, dia: d, texto: e.texto, sub: cli ? cli.nombre : '', anual: e.anual });
  });
  return out.sort((x, y) => x.dia - y.dia);
}
function filaEvento(e, mes) {
  const accion = e.tipo === 'cumple' ? `formCliente('${e.id}')` : `formAgenda('${e.id}')`;
  return `<div class="fila evento" style="justify-content:space-between;padding:5px 6px;margin:0 -6px;border-radius:6px;cursor:pointer;flex-wrap:nowrap" onclick="${accion}" title="Tocá para editar">
    <span>${esc(e.texto)}${e.sub ? ` <span class="muted">· ${esc(e.sub)}</span>` : ''}${e.anual ? ' <span class="muted" title="Se repite todos los años">↻</span>' : ''}</span><b>${String(e.dia).padStart(2, '0')}/${String(mes).padStart(2, '0')}</b></div>`;
}

  const hoy = new Date(); const mesAct = hoy.getFullYear() === anioAgenda ? hoy.getMonth() : -1;
  main(`<div class="cab"><div><h1>Agenda</h1><p>Tocá una anotación para editarla o borrarla. ↻ = se repite todos los años. Los cumpleaños cargados en las fichas de clientes también aparecen acá.</p></div>
    <div class="acciones"><button class="btn" onclick="anioAgenda--;pintar()">‹</button><b style="font-size:17px">${anioAgenda}</b><button class="btn" onclick="anioAgenda++;pintar()">›</button>

async function guardarAgenda(id) {

async function borrarAgenda(id) {

// Agrega un código a un cajón; si ya está en ese cajón, suma la cantidad
async function agregarOSumarEnCajon(cajon, cod, cant, ubic, nota, espera) {
  const ya = S.sobre.find(y => y.cajon === cajon && y.cod === cod);
  if (ya) return remoto({ tipo: 'editarItem', cajon, codigo: cod, cantidad: ya.cant + cant, ubicacion: ya.ubic, nota: (nota ? nota + ' · ' : '') + `se sumaron ${cant} u.` }, espera);
  return remoto({ tipo: 'agregarItem', cajon, codigo: cod, cantidad: cant, ubicacion: ubic || '-', nota }, espera);
}
async function agregarEnCajon() {
  const cod = limpiarCodigo(document.getElementById('nCodC').value);
  const cant = parseInt(document.getElementById('nCantC').value) || 0;
  const ubic = document.getElementById('nUbiC').value.trim().toUpperCase() || '-';
  const nota = document.getElementById('nNotaC').value.trim();
  if (cod.length < 2) { aviso('Poné el código', 'err'); return; }
  if (cant < 1) { aviso('Poné la cantidad', 'err'); return; }
  if (!existeArticulo(cod) && !confirm(`${cod} no está en la lista ni en el stock. ¿Agregarlo igual?`)) return;
  const ya = S.sobre.find(y => y.cajon === cajonSel && y.cod === cod);
  if (!await agregarOSumarEnCajon(cajonSel, cod, cant, ubic, nota, 'Guardando…')) return;
  listaSobre(); aviso(ya ? `${cod} ya estaba: ahora hay ${ya.cant + cant} u.` : `${cod} agregado a ${cajonSel}`, 'ok');
  setTimeout(() => { const e = document.getElementById('nCodC'); if (e) e.focus(); }, 50);
}
async function corregirCodigoSobre(x, nuevoCod, cant, ubic, nota) {
  if (!existeArticulo(nuevoCod) && !confirm(`${nuevoCod} no está en la lista ni en el stock. ¿Cambiar igual?`)) return;
  const ya = S.sobre.find(y => y.cajon === x.cajon && y.cod === nuevoCod);
  const txt = `código corregido ${x.cod} → ${nuevoCod}` + (nota ? ' · ' + nota : '');
  // primero se agrega (o suma) el código nuevo y después se saca el viejo, así nunca se pierde nada
  if (!await agregarOSumarEnCajon(x.cajon, nuevoCod, cant, ubic, txt, 'Corrigiendo el código…')) return;
  if (!await remoto({ tipo: 'eliminarItem', cajon: x.cajon, codigo: x.cod, nota: txt }, 'Corrigiendo el código…')) { listaSobre(); return; }
  listaSobre(); aviso(ya ? `Código corregido: ${x.cod} → ${nuevoCod} (ya estaba en el cajón: se sumaron, ahora ${ya.cant + cant} u.)` : `Código corregido: ${x.cod} → ${nuevoCod}`, 'ok');
}
function formPegarCajon(cajon) {
  abrirModal(`<h3 style="margin-top:0">Pegar varios en ${esc(cajon)}</h3>
    <p class="muted" style="margin-top:0">Pegá la columna de códigos y la de cantidades del Excel. Si un código ya está en el cajón, se suma la cantidad. La ubicación se toma del stock.</p>
    <div class="fila" style="align-items:stretch;gap:10px">

}
function leerPegadoCajon() {
  const c = renglones(document.getElementById('pcCods').value), q = renglones(document.getElementById('pcCants').value);
  const pares = [];
  if (!q.length && c.some(x => x.includes('\t'))) c.forEach(x => { const t = x.split('\t'); if (t[0].trim()) pares.push([t[0], t[1]]); });
  else { if (q.length && q.length !== c.length) return { error: `Hay ${c.length} códigos y ${q.length} cantidades: no coinciden.` }; c.forEach((x, i) => { if (x.trim()) pares.push([x, q.length ? q[i] : '1']); }); }
  const out = {};
  pares.forEach(([cod, cant]) => { cod = limpiarCodigo(cod); const n = parseInt(String(cant || '').replace(/\./g, '')) || 1; out[cod] = (out[cod] || 0) + n; });
  return { filas: Object.keys(out).map(cod => ({ cod, cant: out[cod] })) };
}
function cuentaPegarCajon() {
  const r = leerPegadoCajon(), el = document.getElementById('pcCuenta');
  el.innerHTML = r.error ? `<span style="color:var(--red)">${esc(r.error)}</span>` : r.filas.length ? `${r.filas.length} códigos · ${r.filas.filter(f => !existeArticulo(f.cod)).length} no están en la lista ni en el stock` : '';
}
async function pegarEnCajon(cajon) {
  const r = leerPegadoCajon();
  if (r.error) { aviso(r.error, 'err'); return; }
  if (!r.filas.length) { aviso('Pegá los códigos', 'err'); return; }
  const raros = r.filas.filter(f => !existeArticulo(f.cod));
  if (raros.length && !confirm(`${raros.length} códigos no están en la lista ni en el stock (${raros.slice(0, 5).map(f => f.cod).join(', ')}${raros.length > 5 ? '…' : ''}). ¿Agregarlos igual?`)) return;
  const nota = document.getElementById('pcNota').value.trim();
  cerrarModal();
  let ok = 0;
  for (let i = 0; i < r.filas.length; i++) {
    const f = r.filas[i]; const a = infoArticulo(f.cod);
    const res = await agregarOSumarEnCajon(cajon, f.cod, f.cant, a.ubic && a.ubic !== '-' ? a.ubic : '-', nota, `Agregando ${i + 1} de ${r.filas.length}…`);
    if (!res) { aviso(`Se cortó en ${f.cod}: se agregaron ${ok} de ${r.filas.length}. Lo que falta, volvé a pegarlo.`, 'err'); break; }
    ok++;
  }
  cajonSel = cajon; listaSobre();
  if (ok === r.filas.length) aviso(`${ok} códigos agregados a ${cajon}`, 'ok');
}

// ============ Sobre stock: reponer en estantería y planillas para imprimir ============
function numStock(v) {
  if (v === null || v === undefined) return null;
  let t = String(v).trim(); if (!t || t === '-') return null;
  if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, '');
  const n = parseFloat(t.replace(',', '.'));
  return isNaN(n) ? null : n;
}
// Artículos donde en la estantería queda 1 o ninguno (stock total menos lo que está en el sobre stock)
function paraReponer() {
  const porCod = {};
  S.sobre.forEach(x => { if (x.cant > 0) (porCod[x.cod] = porCod[x.cod] || []).push(x); });
  const out = [];
  Object.keys(porCod).forEach(cod => {
    const a = infoArticulo(cod);
    const total = numStock(a.stock);
    if (total === null) return;               // sin dato de stock: no se puede calcular
    const enSobre = porCod[cod].reduce((s, x) => s + x.cant, 0);
    const estanteria = total - enSobre;
    if (estanteria <= 1) out.push({ cod, desc: a.desc, ubicEst: a.ubic && a.ubic !== '-' ? a.ubic : (porCod[cod][0].ubic || '-'), total, enSobre, estanteria, items: porCod[cod] });
  });
  return out.sort((a, b) => a.estanteria - b.estanteria || String(a.ubicEst).localeCompare(String(b.ubicEst)));
}
// Un renglón por cajón y artículo, ordenado por número de cajón (para recorrer los cajones en orden) y después por ubicación
function reponerPorCajon() {
  const nro = c => { const m = String(c || '').match(/(\d+)\s*$/); return m ? Number(m[1]) : 9999; };
  const filas = [];
  paraReponer().forEach(r => r.items.forEach(x => filas.push({ r, x })));
  return filas.sort((a, b) => nro(a.x.cajon) - nro(b.x.cajon) || a.x.cajon.localeCompare(b.x.cajon) || String(a.r.ubicEst).localeCompare(String(b.r.ubicEst), 'es', { numeric: true }) || a.r.cod.localeCompare(b.r.cod));
}
function panelReponer() {
  const l = paraReponer();
  if (!l.length) return '';

  const quedan = r => `<span class="tag ${r.estanteria <= 0 ? 't-red' : 't-amber'}">${r.estanteria <= 0 ? 'ninguno' : '1'}</span>${r.estanteria < 0 ? '<div class="muted" style="font-size:11px">el stock dice menos que el sobre stock</div>' : ''}`;
  return `<div class="panel" style="margin-bottom:14px;border-color:var(--amber)">

    <div class="muted" style="font-size:12px;margin-bottom:8px">En la estantería queda 1 o ninguno. Ordenado por cajón, de menor a mayor: abrís cada cajón una sola vez. Cuando lo pasen, tocá “Pasé a estantería” y se descuenta del cajón.</div>
    <div class="tabla-scroll" style="max-height:420px;overflow:auto"><table class="t"><tr><th>Código</th><th>Descripción</th><th class="der">En el cajón</th><th>Va a estantería</th><th>Quedan</th><th></th></tr>
    ${filas.map(({ r, x }) => {
      const cab = x.cajon !== cajonAnt ? (cajonAnt = x.cajon, `<tr><td colspan="6" style="background:#1a2540;font-weight:700;color:var(--amber);padding-top:10px">${esc(x.cajon)} <span class="muted" style="font-weight:400">· ${((n) => n + (n === 1 ? ' artículo' : ' artículos'))(filas.filter(f => f.x.cajon === x.cajon).length)}</span></td></tr>`) : '';
      return cab + `<tr><td class="num" style="color:var(--amber)">${esc(r.cod)}</td><td>${esc(r.desc)}</td><td class="der"><b>${x.cant} u.</b></td><td>${esc(r.ubicEst)}</td><td>${quedan(r)}</td>
        <td><button class="btn chico azul" onclick="formReponer('${x.id}')">Pasé a estantería</button></td></tr>`;
    }).join('')}</table></div></div>`;
}

async function confirmarReponer(id) {
  const x = S.sobre.find(y => y.id === id); if (!x) return;
  const n = parseInt(document.getElementById('repCant').value) || 0;
  if (n < 1) { aviso('Poné cuántas sacaste', 'err'); return; }
  if (n > x.cant) { aviso(`En el cajón hay ${x.cant} u., no se pueden sacar ${n}`, 'err'); return; }
  const nota = `Repuesto a estantería: ${n} u.`;
  const r = n === x.cant
    ? await remoto({ tipo: 'eliminarItem', cajon: x.cajon, codigo: x.cod, nota }, 'Guardando…')
    : await remoto({ tipo: 'editarItem', cajon: x.cajon, codigo: x.cod, cantidad: x.cant - n, ubicacion: x.ubic, nota }, 'Guardando…');
  if (!r) return;
  cerrarModal(); indexarSobre(); pintar();
  aviso(`${x.cod}: ${n} u. pasadas a la estantería (quedan ${x.cant - n} en ${x.cajon})`, 'ok');
}

// --- PDF imprimibles (fondo blanco, letra negra)
function pdfBase() { const { jsPDF } = window.jspdf; return new jsPDF({ unit: 'pt', format: 'a4' }); }
function pieDePagina(doc, texto) {
  const n = doc.internal.getNumberOfPages(), W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(120); doc.text(texto, 40, H - 22); doc.text(`Hoja ${i} de ${n}`, W - 40, H - 22, { align: 'right' }); }
}
const ESTILO_TABLA = { theme: 'grid', styles: { font: 'helvetica', fontSize: 11, textColor: 20, cellPadding: 6, lineColor: 190, lineWidth: 0.5, valign: 'middle' },
  headStyles: { fillColor: [225, 225, 225], textColor: 20, fontStyle: 'bold' }, alternateRowStyles: { fillColor: [246, 246, 246] }, margin: { left: 40, right: 40, bottom: 40 } };
function pdfCajones(cajones) {
  cajones = cajones.filter(c => S.sobre.some(x => x.cajon === c));
  if (!cajones.length) { aviso('No hay artículos en esos cajones', 'err'); return; }
  const doc = pdfBase(); const W = doc.internal.pageSize.getWidth(); const fecha = new Date().toLocaleDateString('es-AR');
  cajones.forEach((c, i) => {
    if (i) doc.addPage();
    const it = S.sobre.filter(x => x.cajon === c).sort((a, b) => a.cod.localeCompare(b.cod));
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(90); doc.text('SOBRE STOCK · ' + (S.ajustes.empresa || 'Navicam'), 40, 46);
    doc.text(fecha, W - 40, 46, { align: 'right' });
    doc.setFont('helvetica', 'bold'); doc.setFontSize(26); doc.setTextColor(10); doc.text(c, 40, 80);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(70);
    doc.text(`${it.length} artículos · ${it.reduce((a, x) => a + x.cant, 0)} unidades`, 40, 100);
    doc.setDrawColor(20); doc.setLineWidth(1.2); doc.line(40, 110, W - 40, 110);
    doc.autoTable(Object.assign({}, ESTILO_TABLA, {
      startY: 122,
      head: [['Cant.', 'Código', 'Descripción', 'Ubicación']],
      body: it.map(x => [String(x.cant), x.cod, infoArticulo(x.cod).desc || '', x.ubic || '-']),
      columnStyles: { 0: { halign: 'center', fontStyle: 'bold', fontSize: 13, cellWidth: 50 }, 1: { font: 'courier', fontStyle: 'bold', cellWidth: 105 }, 3: { cellWidth: 85, halign: 'center' } }
    }));
  });
  pieDePagina(doc, 'Sobre stock · impreso el ' + fecha);
  doc.save((cajones.length === 1 ? cajones[0] : 'Sobre stock - todos los cajones').replace(/[\\/:*?"<>|]+/g, ' ') + '.pdf');
}
function pdfReponer() {
  const l = paraReponer(); if (!l.length) { aviso('No hay nada para reponer', 'ok'); return; }
  const doc = pdfBase(); const W = doc.internal.pageSize.getWidth(); const fecha = new Date().toLocaleDateString('es-AR');
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(90); doc.text('SOBRE STOCK · ' + (S.ajustes.empresa || 'Navicam'), 40, 46); doc.text(fecha, W - 40, 46, { align: 'right' });

async function borrarCajonEntero(nombre) {
  const nota = document.getElementById('bcNota').value.trim();
  const it = S.sobre.filter(x => x.cajon === nombre);
  cerrarModal(); escribiendo++;
  const t0 = avisoFijo('Borrando ' + nombre + '…');
  let r = await enviarOp({ tipo: 'eliminarCajon', nombre, conArticulos: true, nota }).catch(e => ({ error: e.message }));
  t0.remove();
  if (r && r.error && /Eliminá los artículos primero/.test(r.error)) {
    // servidor anterior: se sacan los artículos de a uno y después el cajón
    const t = avisoFijo(`Borrando ${it.length} artículos de ${nombre}…`);
    try {
      for (const x of it) await enviarOp({ tipo: 'eliminarItem', cajon: x.cajon, codigo: x.cod, nota: nota || 'Se borró el cajón entero' });
      r = await enviarOp({ tipo: 'eliminarCajon', nombre, nota });
    } catch (e) { r = { error: e.message }; } finally { t.remove(); }
  }
  escribiendo--;
  if (!r || r.error) { aviso('❌ No se pudo borrar el cajón: ' + ((r && r.error) || 'sin respuesta') + '. Lo que se alcanzó a borrar quedó en el Historial.', 'err'); indexarSobre(); pintar(); return; }
  cajonSel = ''; indexarSobre(); ir('sobre');
  aviso(`${nombre} borrado (${it.length} artículos)`, 'ok');

function cerrarSug() { const el = document.getElementById('sug'); if (el) el.style.display = 'none'; }
document.addEventListener('click', e => { if (!e.target.closest('.busca')) cerrarSug(); });

// --- guardar
function armarDesdeBorrador() {

// ---- disponibilidad (stock del depósito + sobre stock)
function stockTotal(cod) { const a = infoArticulo(cod); const n = parseFloat(String(a.stock === null ? 0 : a.stock).replace(',', '.')); return Math.max(0, (isNaN(n) ? 0 : n) + (a.sobre || 0)); }

  return { manual: !!d.manual, inmediata: inm, dias: d.dias === undefined || d.dias === null ? '' : d.dias, sinAbast: !!d.sinAbast };
}
function textoDispo(l) {

    ${resto > 0 ? (d.sinAbast ? '' : `<span class="muted">resto en</span> <input class="in" type="number" min="0" value="${d.dias}" placeholder="días" style="width:56px;padding:2px 4px" onchange="ponerDispo(${i},'dias',this.value)"> <span class="muted">días</span>`)
      + `<label style="display:block;margin-top:3px;cursor:pointer;font-size:12px"><input type="checkbox" ${d.sinAbast ? 'checked' : ''} onchange="ponerDispo(${i},'sinAbast',this.checked)"> sin abastecimiento</label>` : ''}
    ${d.manual ? ` <a href="#" style="font-size:11px" onclick="ponerDispo(${i},'auto');return false" title="Volver a calcular con el stock">↺</a>` : ''}</div>`;

let guardandoPresu = false;

// ============ Artículos propios (no son de Iveco) ============
// Viven en la hoja "Artículos propios" de la planilla. Ninguna importación los toca. Precio en pesos, sin IVA, lo ponen ellos.
function leerStock(v) {
  let t = String(v === undefined || v === null ? '' : v).trim();
  if (!t) return null;
  if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  const n = parseFloat(t.replace(',', '.'));
  return isNaN(n) ? null : n;
}
function docPropio(cod) { const p = S.propios[cod] || {}; return { id: cod, desc: p.desc || '', tipo: p.tipo || '', ubic: p.ubic || '', stock: p.stock === undefined ? null : p.stock, precio: p.precio === undefined ? null : p.precio, fecha: p.fecha || '' }; }
function aPropio(d) { return { desc: d.desc || '', tipo: d.tipo || '', ubic: d.ubic || '', stock: d.stock, precio: d.precio, fecha: d.fecha || '' }; }

// --- crear / editar uno

async function guardarMasivo() {
  const vistos = {}; masivo.forEach(r => { vistos[r.id] = (vistos[r.id] || 0) + 1; });
  if (masivo.some(r => !r.id)) { aviso('Hay filas sin código', 'err'); return; }
  const rep = Object.keys(vistos).filter(k => vistos[k] > 1);
  if (rep.length) { aviso('Códigos repetidos: ' + rep.join(', ') + '. Dejá uno solo.', 'err'); return; }
  if (masivo.some(r => !r.desc) && !confirm('Hay artículos sin descripción. ¿Guardar igual?')) return;
  const hoy = hoyISO();
  const docs = masivo.map(r => { const d = { id: r.id, desc: r.desc, tipo: r.tipo, ubic: r.ubic, stock: r.stock, fecha: hoy }; if (r.precio) d.precio = r.precio; else if (!S.propios[r.id]) d.precio = null; return d; });
  const nuevos = docs.filter(d => !S.propios[d.id]).length;
  const res = await remoto({ tipo: 'guardarDocs', tabla: 'articulos', fusionar: true, docs, reg: { tipo: 'Artículo propio', detalle: `Carga masiva: ${nuevos} nuevos, ${docs.length - nuevos} actualizados` } }, `Guardando ${docs.length} artículos…`, 90000);
  if (!res) return;
  docs.forEach(d => { S.propios[d.id] = aPropio(Object.assign(docPropio(d.id), d)); });
  guardar('propios'); cerrarModal(); masivo = [];
  aviso(`${docs.length} artículos guardados (${nuevos} nuevos)`, 'ok');
  if (vista === 'articulos') pintar(); else ir('articulos');
}

let pegado = [];
function formPegar() {
  abrirModal(`<h3 style="margin-top:0">Pegar códigos y cantidades</h3>
    <p class="muted" style="margin-top:0">Una línea por artículo: <b>código y cantidad</b>, en cualquier orden, separados por espacio o tabulación (podés copiar dos columnas del Excel, de un mail o de WhatsApp). Si no ponés cantidad, va 1.</p>
    <textarea class="in" id="txtPegar" rows="12" placeholder="2992544 12&#10;500041178	40&#10;LUB020-P-I 2"></textarea>
    <div class="fila" style="margin-top:12px;justify-content:flex-end"><button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn pri" onclick="leerPegado()">Revisar →</button></div>`);
  setTimeout(() => { const e = document.getElementById('txtPegar'); if (e) e.focus(); }, 50);
}
function leerLineaPegada(f) {
  const t = f.split(/[\t;]|\s+/).map(x => x.trim()).filter(Boolean);
  const esCant = x => /^\d{1,5}([.,]\d+)?$/.test(x);
  let iCod = t.findIndex(x => existeArticulo(limpiarCodigo(x)));
  if (iCod < 0) iCod = t.findIndex(x => !esCant(x) && /\d/.test(x));
  if (iCod < 0) iCod = t.findIndex(x => x.replace(/\D/g, '').length >= 6);
  if (iCod < 0) return null;
  const iCant = t.findIndex((x, i) => i !== iCod && esCant(x));
  const cant = iCant >= 0 ? Math.max(1, Math.round(parseFloat(t[iCant].replace(',', '.')))) : 1;
  return { cod: limpiarCodigo(t[iCod]), cant };
}
function leerPegado() {
  const lineas = document.getElementById('txtPegar').value.split(/\r?\n/).filter(f => f.trim());
  const malas = [];
  pegado = [];
  lineas.forEach(f => { const r = leerLineaPegada(f); if (r) pegado.push(r); else malas.push(f.trim()); });
  if (!pegado.length) { aviso('No encontré códigos en lo que pegaste.', 'err'); return; }
  if (malas.length) aviso(`No se entendieron ${malas.length} líneas: ${malas.slice(0, 5).join(' · ')}`, '');
  mostrarRevisionPegado();
}
function mostrarRevisionPegado() {
  const b = B(); const cli = cliente(b.clienteId);
  const cuenta = {}; pegado.forEach(r => { cuenta[r.cod] = (cuenta[r.cod] || 0) + 1; });
  let total = 0, faltan = 0;
  const filas = pegado.map((r, i) => {
    const a = infoArticulo(r.cod); const existe = existeArticulo(r.cod);
    const lista = a.propio ? a.precioArs : a.usd * b.dolar;
    const desc = a.propio ? 0 : descCliente(cli, a.D).pct;
    const unit = r2(lista * (1 - desc / 100)); if (existe) total += unit * r.cant; else faltan++;
    const reemp = S.reemplazos[r.cod];
    return `<tr><td><input class="in" style="width:130px;padding:4px 6px" value="${esc(r.cod)}" onchange="pegado[${i}].cod=limpiarCodigo(this.value);delete pegado[${i}].reemplazaA;mostrarRevisionPegado()">
        ${r.reemplazaA ? `<div style="font-size:11px" class="muted">reemplaza a ${esc(r.reemplazaA)}</div>` : ''}</td>
      <td style="font-size:13px">${existe ? esc(a.desc) : '<span class="tag t-red">No existe</span> <button class="btn chico azul" onclick="formArticulo({id:pegado[' + i + '].cod},{volverPegado:true})">＋ Crear</button>'}
        ${a.propio ? ' <span class="tag t-violet">propio</span>' : ''}${cuenta[r.cod] > 1 ? ' <span class="tag t-amber">repetido: se suman</span>' : ''}
        ${reemp && !r.reemplazaA ? `<div><span class="tag t-amber">Tiene reemplazo: ${esc(reemp)}</span> <button class="btn chico azul" onclick="pegado[${i}].reemplazaA=pegado[${i}].cod;pegado[${i}].cod='${esc(reemp)}';mostrarRevisionPegado()">Usar</button></div>` : ''}</td>
      <td class="der"><input class="in" type="number" min="1" style="width:70px;text-align:right;padding:4px 6px" value="${r.cant}" onchange="pegado[${i}].cant=Math.max(1,parseInt(this.value)||1);mostrarRevisionPegado()"></td>
      <td class="der num">${existe ? (lista ? plata(unit) : '<span class="muted">sin precio</span>') : ''}${desc ? ` <span class="muted" style="font-size:11px">(-${desc}%)</span>` : ''}</td>
      <td class="der num" style="font-size:12px">${existe ? (a.stock !== null ? esc(a.stock) : '<span class="muted">—</span>') : ''}</td>
      <td><button class="btn chico rojo" title="Sacar" onclick="pegado.splice(${i},1);mostrarRevisionPegado()">✕</button></td></tr>`;
  }).join('');
  const listos = pegado.filter(r => existeArticulo(r.cod)).length;
  abrirModal(`<h3 style="margin-top:0">Revisá antes de agregar · ${pegado.length} renglones</h3>
    <p class="muted" style="margin-top:0">${cli ? 'Precios con el descuento de ' + esc(cli.nombre) : 'Sin cliente elegido: precios de lista'}, sin IVA. Podés corregir códigos y cantidades.</p>
    <div style="max-height:52vh;overflow:auto"><table class="t"><tr><th>Código</th><th>Descripción</th><th class="der">Cant</th><th class="der">Unitario</th><th class="der">Stock</th><th></th></tr>${filas}</table></div>
    <div class="fila" style="margin-top:10px;justify-content:space-between">
      <div class="muted">Total aprox.: <b>${plata(total)}</b> + IVA${faltan ? ` · <span style="color:var(--red)">${faltan} no existen</span>` : ''}</div>
      ${faltan ? `<label style="font-size:13px;cursor:pointer"><input type="checkbox" id="pegarTodos"> Agregar también los que no existen (precio a mano)</label>` : ''}</div>
    <div class="fila" style="margin-top:12px;justify-content:flex-end"><button class="btn" onclick="formPegar()">← Volver a pegar</button><button class="btn" onclick="cerrarModal()">Cancelar</button>
      <button class="btn pri" onclick="agregarPegado()">Agregar al presupuesto</button></div>`, true);

function agregarPegado() {
  const todos = document.getElementById('pegarTodos') && document.getElementById('pegarTodos').checked;
  const b = B(); let n = 0, salteados = 0;
  pegado.forEach(r => {
    if (!existeArticulo(r.cod) && !todos) { salteados++; return; }
    const yaEstaba = b.items.some(x => x.cod === r.cod || baseDe(x).cod === r.cod || x.reemplazaA === r.cod);
    agregarSinPintar(r.cod, r.cant); n++;
    // la marca "reemplaza a" solo en un renglón nuevo (si se sumó a uno que ya estaba, no se cambia)
    if (r.reemplazaA && !yaEstaba) { const l = b.items.find(x => x.cod === r.cod || baseDe(x).cod === r.cod); if (l && !l.reemplazaA) l.reemplazaA = r.reemplazaA; }
  });
  guardar('borrador'); cerrarModal(); pegado = []; pintar();
  aviso(`${n} artículos agregados al presupuesto` + (salteados ? ` · ${salteados} sin agregar porque no existen` : ''), salteados ? '' : 'ok');
}

  const ps = base.filter(p => mPeriodo === 'todo' || mesDe(p.fecha) === mPeriodo);
  const presup = ps.reduce((a, p) => a + montoPresu(p), 0);

  const vendido = cerrados.reduce((a, p) => a + montoVendido(p), 0);
  const presCerr = cerrados.reduce((a, p) => a + montoPresu(p), 0);

  const abiertos = ps.filter(p => p.estado !== 'cerrado');

  // motivos (ítems no vendidos de presupuestos cerrados)
  const mot = {};
  cerrados.forEach(p => p.items.forEach(l => {
    const nv = l.cant - (l.vendido || 0); if (nv <= 0) return;
    const k = l.motivo || '(sin motivo)'; mot[k] = mot[k] || { n: 0, monto: 0 }; mot[k].n++; mot[k].monto += r2(l.unit * nv);
  }));
  const motOrden = Object.entries(mot).sort((a, b) => b[1].monto - a[1].monto);
  const maxMot = Math.max(1, ...motOrden.map(x => x[1].monto));

  const cliOrden = Object.values(porCli).sort((a, b) => b.vend - a.vend || b.pres - a.pres).slice(0, 10);
  // artículos

  ps.forEach(p => p.items.forEach(l => { const a = porArt[l.cod] = porArt[l.cod] || { desc: l.desc, cot: 0, vend: 0, veces: 0 }; a.veces++; a.cot += l.cant; if (p.estado === 'cerrado') a.vend += l.vendido || 0; }));
  const artOrden = Object.entries(porArt).sort((a, b) => b[1].veces - a[1].veces || b[1].cot - a[1].cot).slice(0, 10);

  const pct = x => x === null || isNaN(x) ? '—' : fmt(x * 100, 0) + ' %';
  main(`<div class="cab"><div><h1>Métricas de operaciones</h1><p>Salen solas de los presupuestos hechos en la app y de cómo terminó cada uno (no incluyen ventas hechas por fuera). Montos sin IVA.</p></div>

    <div class="campo"><span class="lbl">Cliente</span><select class="in" onchange="mCli=this.value;pintar()"><option value="todos">Todos</option>${[...S.clientes].sort((a, b) => a.nombre.localeCompare(b.nombre)).map(c => `<option value="${c.id}" ${c.id === mCli ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('')}</select></div>
  </div>

    <div class="panel kpi"><small>Tasa de cierre</small><b>${pct(presCerr ? vendido / presCerr : null)}</b><span>por monto, sobre los cerrados · ${cerrados.length ? fmt(conVenta / cerrados.length * 100, 0) + ' % por cantidad' : '—'}</span></div>

function graficoMeses(base) {
  const fin = mPeriodo && mPeriodo !== 'todo' ? mPeriodo : mesDe(hoyISO());

  const barras = d.map((x, i) => { const x0 = i * paso + paso / 2 - bw - 2; const hp = x.pres / max * (H - 40), hv = x.vend / max * (H - 40);

    <div class="fila" style="font-size:12px"><span class="tag" style="background:#4cb3f0;color:#062033">Presupuestado</span><span class="tag" style="background:#34c77b;color:#062014">Vendido</span><span class="muted">Pasá el mouse por las barras para ver los montos.</span></div>`;

async function guardarCliente(id) {

  const desc = {}; ['5', '6', '7', '8', '9'].forEach(d => desc[d] = g('fD' + d).replace(/%/g, '').replace(/\s*\/\s*/g, '/'));
  const cm = g('fCm'), cd = g('fCd');
  const datos = { nombre, categoria: g('fCat'), cuit: g('fCuit'), localidad: g('fLoc'), contacto: g('fCon'), whatsapp: g('fWa'), pago: g('fPago'), notas: g('fNotas'), desc,

// --- lectura de Excel
function buscarEncabezado(rows, campos, obligatorio) {
  for (let i = 0; i < Math.min(rows.length, 40); i++) {
    const celdas = Array.from(rows[i] || [], normalizar); const col = {};
    for (const [n, alt] of Object.entries(campos)) { const idx = celdas.findIndex(c => alt.includes(c)); if (idx !== -1) col[n] = idx; }
    if (col[obligatorio] !== undefined && Object.keys(col).length >= 2) return { fila: i, col };
  }
  return null;
}
function leerExcel(ev, fn) {
  const f = ev.target.files[0]; if (!f) return; ev.target.value = '';
  aviso('Leyendo ' + f.name + '…');
  const rd = new FileReader();
  rd.onload = async e => { try { await fn(XLSX.read(new Uint8Array(e.target.result), { type: 'array' }), f.name); } catch (err) { aviso('Error al leer ' + f.name + ': ' + err.message, 'err'); } };
  rd.readAsArrayBuffer(f);
}
const filas = (wb, n) => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '' });
// Hoja NEXPRO de la lista: PN genuino → equivalentes NEXPRO (código, descripción, precio USD, D, aplicación)
function leerNexpro(wb) {
  for (const h of wb.SheetNames) {
    const r = filas(wb, h);
    for (let i = 0; i < Math.min(r.length, 20); i++) {
      const cel = Array.from(r[i] || [], normalizar);
      const g = cel.indexOf('pn genuino'), n = cel.indexOf('pn nexpro');
      if (g < 0 || n < 0) continue;
      const pr = cel.findIndex(c => c.startsWith('precio de lista') && c.includes('nexpro'));
      const d = cel.lastIndexOf('codigo de descuento asociado');
      const det = cel.indexOf('detalle nexpro'), dsc = cel.indexOf('descripcion nexpro'), ap = cel.indexOf('aplicacion');
      const o = {};
      for (let k = i + 1; k < r.length; k++) {
        const gc = limpiarCodigo(r[k][g]), nc = limpiarCodigo(r[k][n]);
        if (gc.length < 2 || nc.length < 2) continue;
        (o[gc] = o[gc] || []).push([nc, String((det >= 0 && r[k][det]) || (dsc >= 0 && r[k][dsc]) || '').trim(), pr >= 0 ? parseFloat(r[k][pr]) || 0 : 0, d > n ? String(r[k][d]).trim() || '-' : '-', ap >= 0 ? String(r[k][ap]).trim() : '']);
      }
      return o;
    }
  }
  return null;
}
function impStock(ev) {
  leerExcel(ev, async (wb, nombre) => {
    const campos = { codigo: ['codigo', 'articulo', 'cod'], descripcion: ['descripcion', 'denominacion'], ubicacion: ['ubicacion', 'posicion'], stock: ['stock', 'cantidad', 'cant.', 'cant'] };
    const out = [];
    wb.SheetNames.forEach(h => { const r = filas(wb, h); const e = buscarEncabezado(r, campos, 'codigo'); if (!e) return; const c = e.col;
      for (let i = e.fila + 1; i < r.length; i++) { const cod = limpiarCodigo(r[i][c.codigo]); if (cod.length < 2) continue;
        out.push([cod, c.descripcion !== undefined ? String(r[i][c.descripcion]).trim() : '', c.stock !== undefined ? String(r[i][c.stock]).trim() : '-', c.ubicacion !== undefined ? (String(r[i][c.ubicacion]).trim() || '-') : '-']); } });
    if (!out.length) { aviso('No encontré un encabezado “Codigo” en ese archivo.', 'err'); return; }
    const r = await remoto({ tipo: 'subirDatos', tipoDatos: 'stock', archivo: nombre, contenido: JSON.stringify(out) }, `Subiendo stock (${fmt(out.length, 0)} artículos)…`, 120000);
    if (!r) return;
    const res = r.resultado || {};
    S.stock = out; S.ubicCambios = {}; if (res.meta) { S.metas.stock = res.meta.version; S.archivos.stock = nombre + ' · ' + (res.meta.fecha || ''); }

// Todo lo compartido vive en la planilla "Navicam App Datos". Este dispositivo guarda una copia para abrir rápido y sin señal.
const URL_API_PROD = 'https://script.google.com/macros/s/AKfycbwY3sVIFHj0Nbymj8P66lrOXABlW_Knh6xIFuY-mU539xOPD8VVk-NPNpR87scLpiTJBg/exec';
const URL_API = (() => { try { const u = new URLSearchParams(location.search).get('api'); if (u && /^http:\/\/localhost(:\d+)?\//.test(u)) return u; } catch (e) {} return URL_API_PROD; })();
const TABLAS_DOCS = ['clientes', 'presupuestos', 'agenda', 'notas', 'reemplazos', 'motivos', 'ajustes', 'articulos', 'pedidos'];

function fetchConLimite(url, opciones, ms) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms || 15000);
  return fetch(url, Object.assign({}, opciones, { signal: ac.signal })).finally(() => clearTimeout(t));
}
async function apiGet(params, ms) {
  const qs = Object.entries(params).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
  const r = await fetchConLimite(URL_API + (URL_API.includes('?') ? '&' : '?') + qs + '&_ts=' + Date.now(), { cache: 'no-store' }, ms || 20000);
  return r.json();
}
const esperar = ms => new Promise(res => setTimeout(res, ms));
function nombreDispositivo() { return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Celular' : 'PC'; }

// Envía una operación. Si la respuesta de Google no llega, confirma consultando el registro (como en la app anterior).
async function enviarOp(op, ms) {
  op.id = 'op' + Date.now() + Math.random().toString(36).slice(2, 8);
  op.dispositivo = nombreDispositivo();
  const limite = ms || 30000;
  let terminado = false, envioFallidoEn = 0;
  const viaEnvio = (async () => {
    try {
      const r = await fetchConLimite(URL_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion: 'sobre', op }) }, limite);
      return { tipo: 'envio', resp: await r.json() };
    } catch (e) { envioFallidoEn = Date.now(); return { tipo: 'fallo' }; }
  })();
  const viaConsulta = (async () => {
    await esperar(1500);
    const fin = Date.now() + limite + 10000;
    while (!terminado && Date.now() < fin) {
      if (envioFallidoEn && Date.now() - envioFallidoEn > 6000) break;
      try { const v = await apiGet({ accion: 'op', id: op.id }, 15000); if (v.aplicada) return { tipo: 'consulta', v }; } catch (e) {}
      await esperar(2000);
    }
    return { tipo: 'fallo' };
  })();
  const res = await Promise.race([
    viaEnvio.then(x => x.tipo === 'envio' ? x : viaConsulta),
    viaConsulta.then(x => x.tipo === 'consulta' ? x : viaEnvio)
  ]);
  terminado = true;
  let resp;
  if (res.tipo === 'envio') { resp = res.resp; if (!resp.ok) throw new Error(resp.error || 'Error del servidor'); }
  else if (res.tipo === 'consulta') resp = { ok: true, resultado: res.v.entrada.resultado || null, entrada: res.v.entrada, sobre: res.v.sobre };
  else throw new Error('No hay conexión con Google. El cambio NO se guardó.');
  aplicarRespuesta(resp);
  return resp;
}
function aplicarRespuesta(resp) {
  if (resp.sobre) aplicarSobre(resp.sobre);
  if (resp.entrada && !S.registro.some(r => r.id === resp.entrada.id)) { S.registro.unshift(resp.entrada); guardar('registro'); }
  if (resp.resultado && resp.resultado.ubicaciones) { S.ubicCambios = resp.resultado.ubicaciones; guardar('ubicCambios'); }
}
// Envoltorio con aviso: devuelve la respuesta o null si falló (y avisa)
let escribiendo = 0;   // mientras hay un guardado en camino no se baja nada, para no pisar lo recién cambiado
async function remoto(op, textoEspera, ms) {
  const t = textoEspera ? avisoFijo(textoEspera) : null;
  escribiendo++;
  try { return await enviarOp(op, ms); }
  catch (e) { aviso('❌ ' + e.message, 'err'); return null; }
  finally { escribiendo--; if (t) t.remove(); }
}
function avisoFijo(texto) { const d = document.createElement('div'); d.textContent = '⏳ ' + texto; document.getElementById('toast').appendChild(d); return d; }

function aplicarTabla(t, docs) {

  else if (t === 'pedidos') { S.pedidos = docs.map(d => Object.assign({}, d, { items: Array.isArray(d.items) ? d.items : [] })); marcarPedidos(); }
  else if (t === 'articulos') { S.propios = {}; docs.forEach(d => { S.propios[d.id] = { desc: d.desc || '', tipo: d.tipo || '', ubic: d.ubic || '', stock: d.stock, precio: d.precio, fecha: d.fecha || '' }; }); }

}
function aplicarSobre(sobre) {
  if (!sobre) return;
  S.sobre = (sobre.items || []).map(x => ({ id: x.CAJON + '|' + x.CODIGO, cod: x.CODIGO, cant: x.CANTIDAD, ubic: x.UBICACION, cajon: x.CAJON }));
  S.cajones = sobre.cajones || [];
  S.metas.sobre = sobre.version;
  guardar('sobre', 'cajones', 'metas');
}

// --- descarga en partes de las tablas grandes
async function bajarPorPartes(tipo, nombre) {
  const tam = tipo === 'precios' ? 2500 : 1500;
  const pedir = async desde => {
    let ultimo = null;
    for (let i = 0; i < 3; i++) {
      try { const r = await apiGet({ accion: 'pagina', tipo, desde, cuantos: tam }, 45000); if (r && Array.isArray(r.filas)) return r; ultimo = new Error('respuesta inválida'); }
      catch (e) { ultimo = e; }
      await esperar(1500 * (i + 1));
    }
    throw ultimo || new Error('No se pudo descargar ' + nombre);
  };
  const primera = await pedir(0);
  const total = primera.total || 0, version = primera.meta ? primera.meta.version : null;
  const partes = [primera], desdes = [];
  for (let d = tam; d < total; d += tam) desdes.push(d);
  let hechas = 1; const n = desdes.length + 1;
  estadoSync({ ok: null, msg: `Descargando ${nombre} ${hechas}/${n}…` });
  for (let i = 0; i < desdes.length; i += 3) {
    const lote = await Promise.all(desdes.slice(i, i + 3).map(pedir));
    lote.forEach(p => { if (p.meta && version !== null && p.meta.version !== version) throw new Error('Los datos cambiaron durante la descarga'); partes.push(p); });
    hechas += lote.length; estadoSync({ ok: null, msg: `Descargando ${nombre} ${hechas}/${n}…` });
  }
  partes.sort((a, b) => a.desde - b.desde);
  return { meta: primera.meta, filas: [].concat(...partes.map(p => p.filas)) };
}
const GRANDES = { stock: 'stock', precios: 'lista de precios', repos: 'reposicionados', nexpro: 'equivalencias NEXPRO' };
async function bajarGrande(tipo, forzar) {
  const d = await bajarPorPartes(tipo, GRANDES[tipo]);
  if (!aceptarDatos(tipo === 'repos' ? 'repos' : tipo, d.filas.length, forzar)) return false;
  if (tipo === 'stock') S.stock = d.filas;
  else if (tipo === 'precios') { const o = {}; d.filas.forEach(r => { o[r[0]] = [r[1], r[2], r[3]]; }); S.precios = o; }
  else if (tipo === 'repos') { const o = {}; d.filas.forEach(r => { o[r[0]] = r[1]; }); S.reposicionado = o; }
  else { const o = {}; d.filas.forEach(r => { (o[r[0]] = o[r[0]] || []).push([r[1], r[2], r[3], r[4], r[5]]); }); S.nexpro = o; }
  S.archivos[tipo] = d.meta ? ((d.meta.archivo || '') + (d.meta.fecha ? ' · ' + d.meta.fecha : '')).replace(/^ · /, '') : '';
  S.metas[tipo] = d.meta ? d.meta.version : null;
  guardar(tipo === 'repos' ? 'reposicionado' : tipo, 'metas', 'archivos');
  return true;
}

// --- sincronización
let _sync = { ok: null, msg: 'Conectando…', hora: '' }, sincronizando = false, planillaUrl = '';
function estadoSync(e) {
  _sync = Object.assign({ hora: _sync.hora }, e);
  const el = document.getElementById('estadoSync'); if (!el) return;
  const color = _sync.ok === true ? 'var(--green)' : _sync.ok === false ? 'var(--red)' : 'var(--amber)';
  const m = document.getElementById('syncMovil'); if (m) { m.style.background = color; m.title = _sync.ok === true ? 'Sincronizado ' + _sync.hora : _sync.ok === false ? 'Sin conexión con Google' : _sync.msg; }
  el.innerHTML = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-right:6px"></span>${esc(_sync.ok === true ? 'Sincronizado ' + _sync.hora : _sync.ok === false ? (_sync.alerta ? '⚠ Datos protegidos: no se bajó nada' : 'Sin conexión con Google') : _sync.msg)}`
    + (planillaUrl ? ` · <a href="${esc(planillaUrl)}" target="_blank">planilla</a>` : '');
}
// ---- Protección: este dispositivo nunca se vacía por una respuesta rara del servidor ----
const NOMBRE_DATO = { clientes: 'clientes', presupuestos: 'presupuestos', reemplazos: 'reemplazos', notas: 'anotaciones', agenda: 'fechas de agenda', stock: 'artículos de stock', precios: 'precios', repos: 'reposicionados', nexpro: 'equivalencias NEXPRO', sobre: 'renglones de sobre stock', articulos: 'artículos propios', pedidos: 'pedidos' };
function cantidadLocal(t) {
  const n = o => Array.isArray(o) ? o.length : o ? Object.keys(o).length : 0;
  return { clientes: n(S.clientes), presupuestos: n(S.presupuestos), reemplazos: n(S.reemplazos), notas: n(S.notas), agenda: n(S.agenda), stock: n(S.stock), precios: n(S.precios), repos: n(S.reposicionado), nexpro: n(S.nexpro), sobre: n(S.sobre), articulos: n(S.propios), pedidos: n(S.pedidos) }[t] || 0;
}
let alertasDatos = [];
// true = se puede aplicar. Si llegan muchos menos datos que los que hay acá (menos de la mitad), no se toca nada.
function aceptarDatos(t, nuevos, forzar) {
  const hay = cantidadLocal(t);
  if (hay < 5 || nuevos >= hay * 0.5) return true;
  const txt = `La planilla trae ${nuevos} ${NOMBRE_DATO[t] || t} y en este dispositivo hay ${hay}.`;
  if (forzar && confirm(txt + '\n\n¿Reemplazar igual lo de este dispositivo? (Si no estás seguro, poné Cancelar: no se borra nada.)')) return true;
  alertasDatos.push(txt);
  return false;
}
function idPlanilla(url) { const m = String(url || '').match(/\/d\/([^/]+)/); return m ? m[1] : ''; }
async function sincronizar(forzar) {
  if (sincronizando || escribiendo) return; sincronizando = true;
  let cambio = false; alertasDatos = [];
  try {
    const d = await apiGet({ accion: 'estado' });
    if (!d.servidor) throw new Error('El servidor de Google todavía es la versión anterior');
    // Si el servidor empezara a usar otra planilla, no se baja nada de ella
    const pid = idPlanilla(d.planillaUrl);
    if (pid && S.metas.planillaId && pid !== S.metas.planillaId && !(forzar && confirm('El servidor está usando una planilla de datos distinta a la de siempre. ¿Pasar a usar la nueva? (Si no estás seguro, poné Cancelar: no se toca nada.)')))
      throw new Error('ALERTA: el servidor está usando otra planilla. No se bajó nada y tus datos siguen como estaban. Avisá antes de seguir.');
    if (pid && pid !== S.metas.planillaId) { S.metas.planillaId = pid; guardar('metas'); }
    if (d.dolar > 0 && d.dolar !== S.dolar) { S.dolar = Number(d.dolar); guardar('dolar'); pintarDolar(); cambio = true; }
    if (d.sobre && d.sobre.version !== S.metas.sobre && aceptarDatos('sobre', (d.sobre.items || []).length, forzar)) { aplicarSobre(d.sobre); cambio = true; }
    if (d.ubicaciones && JSON.stringify(d.ubicaciones) !== JSON.stringify(S.ubicCambios)) { S.ubicCambios = d.ubicaciones; guardar('ubicCambios'); cambio = true; }
    if (d.planillaUrl) planillaUrl = d.planillaUrl;
    const m = d.metas || {};
    for (const t of TABLAS_DOCS) {
      const v = m['t_' + t] ? m['t_' + t].version : 0;
      if (forzar || v !== (S.metas['t_' + t] || 0) || S.metas['t_' + t] === undefined) {
        const r = await apiGet({ accion: 'tabla', t }, 30000);
        if (r && Array.isArray(r.docs) && aceptarDatos(t, r.docs.length, forzar)) { aplicarTabla(t, r.docs); S.metas['t_' + t] = r.meta ? r.meta.version : 0; cambio = true; }
      }
    }
    for (const g of Object.keys(GRANDES)) {
      const v = m[g] ? m[g].version : null;
      if (v !== null && (forzar || v !== S.metas[g]) && await bajarGrande(g, forzar)) cambio = true;
    }
    guardar('metas');
    if (cambio) { indexarStock(); indexarSobre(); }
    _sync.hora = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    if (alertasDatos.length) throw new Error('ALERTA: ' + alertasDatos.join(' '));
    estadoSync({ ok: true });
    if (!S.metas.notasViejas) await migrarNotasViejas();
  } catch (e) {
    console.warn('Sincronización fallida', e);
    const alerta = /^ALERTA/.test(e.message);
    estadoSync({ ok: false, alerta, msg: e.message });
    if (alerta) avisarAlerta(e.message.replace(/^ALERTA: /, ''));
  }
  sincronizando = false;
  if (cambio) pintarSeguro();
  avisarVencimientos();
}
// No redibujar mientras alguien escribe
let repintarPendiente = false;
function pintarSeguro() {
  const a = document.activeElement;
  if (a && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName) && document.getElementById('main').contains(a)) { repintarPendiente = true; return; }
  if (document.getElementById('modal').classList.contains('on')) { repintarPendiente = true; return; }
  pintar();
}
document.addEventListener('focusout', () => { if (repintarPendiente) { repintarPendiente = false; setTimeout(pintarSeguro, 400); } });
// Aviso fijo (no se va solo) cuando se frenó una descarga sospechosa
let alertaMostrada = '';
function avisarAlerta(txt) {
  if (alertaMostrada === txt) return; alertaMostrada = txt;
  const d = document.createElement('div'); d.className = 'err';
  d.innerHTML = `<b>⚠ Datos protegidos</b><br>${esc(txt)}<br><span style="font-size:12px">No se borró nada de este dispositivo. Avisá antes de seguir cargando.</span> <button class="btn chico" style="margin-left:6px" onclick="this.parentNode.remove()">Entendido</button>`;
  document.getElementById('toast').appendChild(d);
}
async function refrescarRegistro() {
  try { const d = await apiGet({ accion: 'registro' }); if (Array.isArray(d.registro)) { S.registro = d.registro; guardar('registro'); if (vista === 'historial') pintarSeguro(); } } catch (e) {}
}
// Las anotaciones de la app anterior estaban guardadas solo en cada teléfono: se suben una vez
async function migrarNotasViejas() {
  let viejas = null;
  try { viejas = JSON.parse(localStorage.getItem('navicam_notas_v2') || 'null'); } catch (e) {}
  const docs = [];
  if (viejas) Object.keys(viejas).forEach(c => { const n = viejas[c]; if (n && n.texto && n.texto.trim() && !S.notas[c]) docs.push({ id: c, texto: n.texto, fecha: n.fecha || '', ts: Date.now() }); });
  if (docs.length) {
    const r = await remoto({ tipo: 'guardarDocs', tabla: 'notas', docs, reg: { tipo: 'Anotaciones', detalle: `${docs.length} anotaciones de la app anterior de este ${nombreDispositivo().toLowerCase()}` } });
    if (!r) return;
    docs.forEach(d => { S.notas[d.id] = { texto: d.texto, fecha: d.fecha, ts: d.ts }; }); guardar('notas');
  }
  // liberar el espacio que usaba la app anterior
  ['navicam_precios', 'navicam_stock', 'navicam_sobre', 'navicam_cajones', 'navicam_registro', 'navicam_historial'].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
  S.metas.notasViejas = true; guardar('metas');
}

// ============ Instalable como app (PWA) y siempre actualizada ============
const VERSION_APP = '2026-10-23 11:47';
const SEGURO = location.protocol === 'https:' || location.hostname === 'localhost';
if ('serviceWorker' in navigator && SEGURO) {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('No se pudo registrar el service worker', e));
}
// Cada 5 minutos (y al volver a la app) se fija si hay una versión publicada más nueva
let avisoVersion = false;
async function revisarVersion() {
  if (avisoVersion || !SEGURO) return;
  try {
    const r = await fetch('version.txt?_=' + Date.now(), { cache: 'no-store' });
    const v = (await r.text()).trim();
    if (v && v !== VERSION_APP) {
      avisoVersion = true;
      const d = document.createElement('div');
      d.className = 'ok';
      d.innerHTML = `Hay una versión nueva de la app. <button class="btn chico pri" style="margin-left:8px" onclick="actualizarApp()">Actualizar</button>`;
      document.getElementById('toast').appendChild(d);
    }
  } catch (e) {}
}
async function actualizarApp() {
  try { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.update())); } catch (e) {}
  location.reload();
}
// Botón ↻ de arriba a la izquierda: si hay versión nueva la carga; si no, trae los últimos cambios de la planilla
async function actualizarTodo(btn) {
  const botones = document.querySelectorAll('.btnAct'); botones.forEach(b => b.classList.add('girando'));
  try {
    if (SEGURO) {
      try {
        const v = (await (await fetch('version.txt?_=' + Date.now(), { cache: 'no-store' })).text()).trim();
        if (v && v !== VERSION_APP) { aviso('Cargando la versión nueva…', 'ok'); await actualizarApp(); return; }
      } catch (e) {}
    }
    await sincronizar(); refrescarRegistro();
    aviso('Todo al día', 'ok');
  } finally { botones.forEach(b => b.classList.remove('girando')); }
}
setInterval(revisarVersion, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) revisarVersion(); });
setTimeout(revisarVersion, 15000);
// Botón "Instalar" (Chrome / Edge en PC y Android)
let pedidoInstalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedidoInstalar = e; if (vista === 'datos') pintar(); });
window.addEventListener('appinstalled', () => { pedidoInstalar = null; aviso('App instalada', 'ok'); });
function appInstalada() { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone; }
async function instalarApp() {
  if (!pedidoInstalar) return;
  pedidoInstalar.prompt(); await pedidoInstalar.userChoice; pedidoInstalar = null; pintar();
}
function bloqueInstalar() {
  if (appInstalada()) return '<div class="muted">✓ Estás usando la app instalada. Se actualiza sola cuando hay cambios.</div>';
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  return (pedidoInstalar ? '<button class="btn pri" onclick="instalarApp()">⬇ Instalar Navicam en este dispositivo</button>' : '')
    + `<div class="muted" style="font-size:12px;margin-top:8px">${ios ? 'En iPhone: tocá Compartir y después “Agregar a inicio”.'
      : 'En la PC (Chrome o Edge): ícono de instalar en la barra de direcciones, o menú ⋮ → “Instalar Navicam”. En Android: menú ⋮ → “Instalar app”.'} Queda con su propio ícono y ventana, y se actualiza sola cuando publico cambios.</div>`;
}
