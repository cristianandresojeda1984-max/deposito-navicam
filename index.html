<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión Depósito Navicam</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Navicam">

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #d97706;
      --accent-hover: #b45309;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; }
    .container { max-width: 600px; margin: 0 auto; }
    
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .menu-btn { font-size: 1.8rem; background: none; border: none; color: #fbbf24; cursor: pointer; padding: 4px 8px; }
    h1 { font-size: 1.2rem; color: #fbbf24; text-align: center; flex: 1; }

    .drawer {
      position: fixed; top: 0; left: -290px; width: 290px; height: 100%;
      background: var(--card-bg); border-right: 1px solid var(--border);
      transition: left 0.3s ease; z-index: 1000; padding: 20px;
      display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
    }
    .drawer.open { left: 0; }
    .overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); display: none; z-index: 999;
    }
    .overlay.active { display: block; }

    .menu-title { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin-top: 12px; font-weight: bold; letter-spacing: 0.5px; }
    .menu-item {
      display: flex; align-items: center; gap: 10px; padding: 12px;
      background: #0f172a; border-radius: 6px; color: var(--text);
      border: 1px solid var(--border); cursor: pointer; font-size: 0.9rem;
    }
    .menu-item:hover { border-color: var(--accent); }
    
    .dollar-box { background: #0f172a; padding: 12px; border-radius: 6px; border: 1px solid var(--accent); }
    .dollar-box label { font-size: 0.8rem; color: #fbbf24; display: block; margin-bottom: 6px; font-weight: bold; }
    .dollar-box input { width: 100%; padding: 8px; background: var(--card-bg); border: 1px solid var(--border); color: #fff; border-radius: 4px; font-size: 1rem; }

    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); padding: 10px 14px; border-radius: 8px;
      margin-bottom: 16px; font-size: 0.85rem; border: 1px solid var(--border); flex-wrap: wrap; gap: 4px;
    }
    .status-indicator { display: flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; }

    .search-box { margin-bottom: 16px; }
    input[type="text"], input[type="number"] {
      width: 100%; padding: 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card-bg);
      color: #fff; font-size: 1rem; outline: none;
    }
    input[type="text"]:focus, input[type="number"]:focus { border-color: var(--accent); }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
    .code-container { display: flex; align-items: center; gap: 8px; }
    .code { font-weight: bold; font-size: 1.15rem; color: #38bdf8; }
    .disc-tag { background: #d97706; color: #fff; font-size: 0.75rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
    .badge { background: #334155; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; color: #fbbf24; }
    .description { font-size: 0.95rem; margin-bottom: 10px; color: #e2e8f0; }

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.9rem; }
    .info-item { background: #0f172a; padding: 8px; border-radius: 6px; }
    .info-label { font-size: 0.75rem; color: var(--text-muted); display: block; }

    .edit-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .edit-input { background: #0f172a; border: 1px solid var(--border); color: #fbbf24; padding: 6px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9rem; }
    .btn-save { background: var(--accent); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .btn-save:hover { background: var(--accent-hover); }

    .notes-section { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
